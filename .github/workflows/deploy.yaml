# ==============================================================================
# InsightFlow RAG Platform - Automated Continuous Deployment (CD) to Amazon ECS
# ==============================================================================
# Fully Automated Deployment:
# 1. Builds Docker container and pushes to Amazon ECR
# 2. Automatically provisions ECS Cluster if it does not exist
# 3. Registers Task Definition with the latest image and secrets
# 4. Automatically discovers default VPC/subnets and creates ECS Service if first run,
#    or performs a zero-downtime rolling update if already running
# ==============================================================================

name: CD - Deploy to Amazon ECS

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from GitHub Actions

# Target infrastructure in Sydney
env:
  AWS_REGION: "ap-southeast-2"
  ECR_REPOSITORY: "insightflow"
  ECS_CLUSTER: "insightflow-cluster"
  ECS_SERVICE: "insightflow-service"
  TASK_FAMILY: "insightflow-task"

jobs:
  deploy:
    name: Build, Push & Auto-Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Configure AWS credentials from GitHub Secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 3: Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Build, tag, and push single 'latest' Docker image to Amazon ECR
      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Configure ECR to keep only 1 image (automatically deletes older/untagged images)
          aws ecr put-lifecycle-policy \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --lifecycle-policy-text '{"rules":[{"rulePriority":1,"description":"Keep only 1 image","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":1},"action":{"type":"expire"}}]}' \
            --region ${{ env.AWS_REGION }} 2>/dev/null || true

          echo "Building Docker image for InsightFlow..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

          echo "Pushing single 'latest' image to Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> $GITHUB_OUTPUT
          echo "✅ Pushed: $ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # Step 5: Automatically Provision and Deploy to Amazon ECS Fargate
      - name: Auto-Provision & Deploy to ECS
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          echo "=== 1. Ensuring ECS Cluster exists ==="
          aws ecs create-cluster --cluster-name ${{ env.ECS_CLUSTER }} --region ${{ env.AWS_REGION }}

          echo "=== 2. Resolving IAM Task Execution Role ==="
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          EXECUTION_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/ecsTaskExecutionRole"

          # Create execution role if it doesn't already exist
          aws iam create-role \
            --role-name ecsTaskExecutionRole \
            --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ecs-tasks.amazonaws.com"},"Action":"sts:AssumeRole"}]}' 2>/dev/null || true

          aws iam attach-role-policy \
            --role-name ecsTaskExecutionRole \
            --policy-arn arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy 2>/dev/null || true

          echo "=== 3. Registering / Updating Task Definition ==="
          cat <<EOF > task-definition.json
          {
            "family": "${{ env.TASK_FAMILY }}",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "1024",
            "memory": "2048",
            "executionRoleArn": "${EXECUTION_ROLE_ARN}",
            "containerDefinitions": [
              {
                "name": "insightflow",
                "image": "${IMAGE_URI}",
                "essential": true,
                "portMappings": [
                  {
                    "containerPort": 8000,
                    "protocol": "tcp"
                  }
                ],
                "environment": [
                  {"name": "GROQ_API_KEY", "value": "${GROQ_API_KEY}"},
                  {"name": "GOOGLE_API_KEY", "value": "${GOOGLE_API_KEY}"},
                  {"name": "QDRANT_URL", "value": "${QDRANT_URL}"},
                  {"name": "QDRANT_API_KEY", "value": "${QDRANT_API_KEY}"}
                ]
              }
            ]
          }
          EOF

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --region ${{ env.AWS_REGION }} \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          echo "Task Definition registered: ${TASK_DEF_ARN}"

          echo "=== 4. Checking if ECS Service exists ==="
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query "services[?status=='ACTIVE'].serviceName" \
            --output text 2>/dev/null || echo "")

          if [ "$SERVICE_STATUS" = "${{ env.ECS_SERVICE }}" ]; then
            echo "Service exists. Performing rolling update..."
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service ${{ env.ECS_SERVICE }} \
              --task-definition "${TASK_DEF_ARN}" \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}
            echo "✅ Deployment initiated for service '${{ env.ECS_SERVICE }}'!"
          else
            echo "Service does not exist yet. Setting up VPC, Security Group, and creating service..."

            # 4a. Find default VPC
            VPC_ID=$(aws ec2 describe-vpcs \
              --filters "Name=isDefault,Values=true" \
              --region ${{ env.AWS_REGION }} \
              --query "Vpcs[0].VpcId" \
              --output text)

            if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
              VPC_ID=$(aws ec2 describe-vpcs \
                --region ${{ env.AWS_REGION }} \
                --query "Vpcs[0].VpcId" \
                --output text)
            fi
            echo "Using VPC: ${VPC_ID}"

            # 4b. Find subnets in VPC
            SUBNETS=$(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=${VPC_ID}" \
              --region ${{ env.AWS_REGION }} \
              --query "Subnets[:2].SubnetId" \
              --output text | tr '\t' ',')
            echo "Using Subnets: ${SUBNETS}"

            # 4c. Find or create Security Group
            SG_ID=$(aws ec2 describe-security-groups \
              --filters "Name=group-name,Values=insightflow-ecs-sg" "Name=vpc-id,Values=${VPC_ID}" \
              --region ${{ env.AWS_REGION }} \
              --query "SecurityGroups[0].GroupId" \
              --output text 2>/dev/null || echo "")

            if [ -z "$SG_ID" ] || [ "$SG_ID" = "None" ]; then
              SG_ID=$(aws ec2 create-security-group \
                --group-name insightflow-ecs-sg \
                --description "Security group for InsightFlow ECS" \
                --vpc-id "${VPC_ID}" \
                --region ${{ env.AWS_REGION }} \
                --query "GroupId" \
                --output text)

              aws ec2 authorize-security-group-ingress \
                --group-id "${SG_ID}" \
                --protocol tcp \
                --port 8000 \
                --cidr 0.0.0.0/0 \
                --region ${{ env.AWS_REGION }}
            fi
            echo "Using Security Group: ${SG_ID}"

            # 4d. Create ECS Service
            aws ecs create-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service-name ${{ env.ECS_SERVICE }} \
              --task-definition "${TASK_DEF_ARN}" \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SG_ID}],assignPublicIp=ENABLED}" \
              --region ${{ env.AWS_REGION }}

            echo "✅ ECS Service '${{ env.ECS_SERVICE }}' created and deployed successfully!"
          fi

          echo "=== 5. Fetching Live Public IP Address & App URL ==="
          echo "Waiting for task to launch and assign a Public IP..."
          PUBLIC_IP=""
          for i in {1..12}; do
            TASK_ARN=$(aws ecs list-tasks --cluster ${{ env.ECS_CLUSTER }} --service-name ${{ env.ECS_SERVICE }} --region ${{ env.AWS_REGION }} --query "taskArns[0]" --output text 2>/dev/null || echo "")
            if [ -n "$TASK_ARN" ] && [ "$TASK_ARN" != "None" ]; then
              ENI_ID=$(aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER }} --tasks "$TASK_ARN" --region ${{ env.AWS_REGION }} --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text 2>/dev/null || echo "")
              if [ -n "$ENI_ID" ] && [ "$ENI_ID" != "None" ]; then
                PUBLIC_IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI_ID" --region ${{ env.AWS_REGION }} --query "NetworkInterfaces[0].Association.PublicIp" --output text 2>/dev/null || echo "")
                if [ -n "$PUBLIC_IP" ] && [ "$PUBLIC_IP" != "None" ]; then
                  break
                fi
              fi
            fi
            echo "Waiting for container to spin up... (attempt $i/12)"
            sleep 5
          done

          if [ -n "$PUBLIC_IP" ] && [ "$PUBLIC_IP" != "None" ]; then
            echo "=========================================================="
            echo "🚀 LIVE APP URL: http://${PUBLIC_IP}:8000"
            echo "📚 SWAGGER DOCS: http://${PUBLIC_IP}:8000/docs"
            echo "❤️ HEALTH CHECK: http://${PUBLIC_IP}:8000/health"
            echo "=========================================================="

            echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
            echo "- **App URL:** [http://${PUBLIC_IP}:8000](http://${PUBLIC_IP}:8000)" >> $GITHUB_STEP_SUMMARY
            echo "- **Swagger Docs:** [http://${PUBLIC_IP}:8000/docs](http://${PUBLIC_IP}:8000/docs)" >> $GITHUB_STEP_SUMMARY
            echo "- **Health Check:** [http://${PUBLIC_IP}:8000/health](http://${PUBLIC_IP}:8000/health)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Task is still provisioning its IP. View it directly in ECS Console:"
            echo "https://${{ env.AWS_REGION }}.console.aws.amazon.com/ecs/v2/clusters/${{ env.ECS_CLUSTER }}/tasks?region=${{ env.AWS_REGION }}"
          fi
